name: Render ARKON intro video

on:
  push:
    paths:
      - ".github/workflows/build-arkon-video.yml"

permissions:
  contents: write

concurrency:
  group: arkon-video-render
  cancel-in-progress: true

jobs:
  render:
    if: ${{ !contains(github.event.head_commit.message, '[cleanup-video-source]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout ARKON
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install rendering and neural voice tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core fontconfig
          python -m pip install --upgrade pip edge-tts

      - name: Render narrated ARKON MP4
        run: |
          set -euo pipefail
          SCRIPT="Bienvenido a ARKON. Un espacio para aprender, conectar ideas y construir un mejor futuro. Aquí fortalecemos la convivencia, la ciudadanía y las habilidades que nos preparan para trabajar en equipo, resolver problemas y aportar a nuestra comunidad. Explora, participa y convierte el conocimiento en acción. ARKON: aprendemos hoy, transformamos mañana."
          python -m edge_tts --voice es-CO-GonzaloNeural           python - "$DURATION" <<'PY'
          import sys
          duration = float(sys.argv[1])
          captions = [
              (0.00, 0.07, "Bienvenido a ARKON."),
              (0.07, 0.27, "Un espacio para aprender, conectar ideas y construir un mejor futuro."),
              (0.27, 0.56, "Aqui fortalecemos la convivencia, la ciudadania y las habilidades\nque nos preparan para trabajar en equipo."),
              (0.56, 0.71, "Resolver problemas y aportar a nuestra comunidad."),
              (0.71, 0.89, "Explora, participa y convierte el conocimiento en accion."),
              (0.89, 1.00, "ARKON: aprendemos hoy, transformamos manana."),
          ]
          def stamp(seconds):
              total = max(0, round(seconds * 1000))
              hours, total = divmod(total, 3_600_000)
              minutes, total = divmod(total, 60_000)
              seconds, millis = divmod(total, 1000)
              return f"{hours:02}:{minutes:02}:{seconds:02},{millis:03}"
          with open("subtitles.srt", "w", encoding="utf-8") as file:
              for number, (start, end, text) in enumerate(captions, 1):
                  file.write(f"{number}\n{stamp(start*duration)} --> {stamp(end*duration)}\n{text}\n\n")
          PY

          cat > filters.txt <<'FILTERS'
          [0:v]drawbox=x=0:y=0:w=1920:h=1080:color=0x07172b@1:t=fill,drawbox=x=1040:y=180:w=790:h=720:color=0x0c263d@0.8:t=fill,drawbox=x=1040:y=180:w=790:h=720:color=0x2d657e@0.9:t=4,drawbox=x=90:y=60:w=340:h=66:color=0x0c2437@0.95:t=fill,drawbox=x=90:y=60:w=340:h=66:color=0x2d657e@0.9:t=2,drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:text='ARKON':fontcolor=white:fontsize=32:x=118:y=75,drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf:text='APRENDER  /  CONECTAR  /  TRANSFORMAR':fontcolor=0x76f5db:fontsize=15:x=460:y=83,drawbox=x=90:y=955:w=1740:h=2:color=0x2d657e@0.8:t=fill,drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:text='ARKON  /  EDUCACION PARA LA VIDA':fontcolor=0x91a9c2:fontsize=17:x=100:y=985,drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:text='CONVIVENCIA  -  CIUDADANIA  -  FUTURO':fontcolor=0x91a9c2:fontsize=17:x=1815-tw:y=985,drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:text='01 / 05':fontcolor=0x76f5db:fontsize=26:x=1690:y=225,drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:text='Aprende.':fontcolor=white:fontsize=86:x=140:y=300,drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:text='Conecta.':fontcolor=white:fontsize=86:x=140:y=410,drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:text='Transforma.':fontcolor=0x76f5db:fontsize=86:x=140:y=520,drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf:text='Ideas que se convierten en acciones.':fontcolor=0xa0b8cf:fontsize=28:x=145:y=680,drawbox=x=1110:y=310:w=650:h=110:color=0x142f45@1:t=fill,drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:text='DESCUBRE':fontcolor=0x76f5db:fontsize=30:x=1160:y=350,drawbox=x=1110:y=460:w=650:h=110:color=0x142f45@1:t=fill,drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:text='CONECTA':fontcolor=0x4ccbed:fontsize=30:x=1160:y=500,drawbox=x=1110:y=610:w=650:h=110:color=0x142f45@1:t=fill,drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:text='CREA':fontcolor=0x9eb4ff:fontsize=30:x=1160:y=650[v0];
          [1:v]drawbox=x=0:y=0:w=1920:h=1080:color=0x07172b@1:t=fill,drawbox=x=1040:y=180:w=790:h=720:color=0x0c263d@0.8:t=fill,drawbox=x=1040:y=180:w=790:h=720:color=0x2d657e@0.9:t=4,drawbox=x=90:y=60:w=340:h=66:color=0x0c2437@0.95:t=fill,drawbox=x=90:y=60:w=340:h=66:color=0x2d657e@0.9:t=2,drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:text='ARKON':fontcolor=white:fontsize=32:x=118:y=75,drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf:text='APRENDER  /  CONECTAR  /  TRANSFORMAR':fontcolor=0x76f5db:fontsize=15:x=460:y=83,drawbox=x=90:y=955:w=1740:h=2:color=0x2d657e@0.8:t=fill,drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:text='ARKON  /  EDUCACION PARA LA VIDA':fontcolor=0x91a9c2:fontsize=17:x=100:y=985,drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:text='CONVIVENCIA  -  CIUDADANIA  -  FUTURO':fontcolor=0x91a9c2:fontsize=17:x=1815-tw:y=985,drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:text='02 / 05':fontcolor=0x76f5db:fontsize=26:x=1690:y=225,drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:text='Conocimiento':fontcolor=white:fontsize=75:x=140:y=300,drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:text='que abre':fontcolor=white:fontsize=86:x=140:y=410,drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:text='caminos.':fontcolor=0x76f5db:fontsize=86:x=140:y=520,drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf:text='Conecta ideas y descubre nuevas posibilidades.':fontcolor=0xa0b8cf:fontsize=24:x=145:y=680,drawbox=x=1110:y=310:w=650:h=110:color=0x142f45@1:t=fill,drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:text='IDEAS':fontcolor=0x76f5db:fontsize=30:x=1160:y=350,drawbox=x=1110:y=460:w=650:h=110:color=0x142f45@1:t=fill,drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:text='CURIOSIDAD':fontcolor=0x4ccbed:fontsize=30:x=1160:y=500,drawbox=x=1110:y=610:w=650:h=110:color=0x142f45@1:t=fill,drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:text='CREATIVIDAD':fontcolor=0x9eb4ff:fontsize=26:x=1160:y=650[v1];
          [2:v]drawbox=x=0:y=0:w=1920:h=1080:color=0x07172b@1:t=fill,drawbox=x=1040:y=180:w=790:h=720:color=0x0c263d@0.8:t=fill,drawbox=x=1040:y=180:w=790:h=720:color=0x2d657e@0.9:t=4,drawbox=x=90:y=60:w=340:h=66:color=0x0c2437@0.95:t=fill,drawbox=x=90:y=60:w=340:h=66:color=0x2d657e@0.9:t=2,drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:text='ARKON':fontcolor=white:fontsize=32:x=118:y=75,drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf:text='APRENDER  /  CONECTAR  /  TRANSFORMAR':fontcolor=0x76f5db:fontsize=15:x=460:y=83,drawbox=x=90:y=955:w=1740:h=2:color=0x2d657e@0.8:t=fill,drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:text='ARKON  /  EDUCACION PARA LA VIDA':fontcolor=0x91a9c2:fontsize=17:x=100:y=985,drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:text='CONVIVENCIA  -  CIUDADANIA  -  FUTURO':fontcolor=0x91a9c2:fontsize=17:x=1815-tw:y=985,drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:text='03 / 05':fontcolor=0x76f5db:fontsize=26:x=1690:y=225,drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:text='Convivir es':fontcolor=white:fontsize=82:x=140:y=300,drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:text='construir':fontcolor=white:fontsize=86:x=140:y=410,drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:text='comunidad.':fontcolor=0x76f5db:fontsize=82:x=140:y=520,drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf:text='Respeto, escucha y participacion para crecer juntos.':fontcolor=0xa0b8cf:fontsize=23:x=145:y=680,drawbox=x=1110:y=310:w=650:h=110:color=0x142f45@1:t=fill,drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:text='RESPETO':fontcolor=0x76f5db:fontsize=29:x=1160:y=350,drawbox=x=1110:y=460:w=650:h=110:color=0x142f45@1:t=fill,drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:text='DIALOGO':fontcolor=0x4ccbed:fontsize=29:x=1160:y=500,drawbox=x=1110:y=610:w=650:h=110:color=0x142f45@1:t=fill,drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:text='PARTICIPACION':fontcolor=0x9eb4ff:fontsize=25:x=1160:y=650[v2];
          [3:v]drawbox=x=0:y=0:w=1920:h=1080:color=0x07172b@1:t=fill,drawbox=x=1040:y=180:w=790:h=720:color=0x0c263d@0.8:t=fill,drawbox=x=1040:y=180:w=790:h=720:color=0x2d657e@0.9:t=4,drawbox=x=90:y=60:w=340:h=66:color=0x0c2437@0.95:t=fill,drawbox=x=90:y=60:w=340:h=66:color=0x2d657e@0.9:t=2,drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:text='ARKON':fontcolor=white:fontsize=32:x=118:y=75,drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf:text='APRENDER  /  CONECTAR  /  TRANSFORMAR':fontcolor=0x76f5db:fontsize=15:x=460:y=83,drawbox=x=90:y=955:w=1740:h=2:color=0x2d657e@0.8:t=fill,drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:text='ARKON  /  EDUCACION PARA LA VIDA':fontcolor=0x91a9c2:fontsize=17:x=100:y=985,drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:text='CONVIVENCIA  -  CIUDADANIA  -  FUTURO':fontcolor=0x91a9c2:fontsize=17:x=1815-tw:y=985,drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:text='04 / 05':fontcolor=0x76f5db:fontsize=26:x=1690:y=225,drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:text='Habilidades':fontcolor=white:fontsize=78:x=140:y=300,drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:text='para el':fontcolor=white:fontsize=86:x=140:y=410,drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:text='futuro.':fontcolor=0x76f5db:fontsize=86:x=140:y=520,drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf:text='Comunicacion, colaboracion y solucion de problemas.':fontcolor=0xa0b8cf:fontsize=22:x=145:y=680,drawbox=x=1110:y=310:w=650:h=110:color=0x142f45@1:t=fill,drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:text='COMUNICACION':fontcolor=0x76f5db:fontsize=25:x=1160:y=350,drawbox=x=1110:y=460:w=650:h=110:color=0x142f45@1:t=fill,drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:text='COLABORACION':fontcolor=0x4ccbed:fontsize=25:x=1160:y=500,drawbox=x=1110:y=610:w=650:h=110:color=0x142f45@1:t=fill,drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:text='SOLUCIONES':fontcolor=0x9eb4ff:fontsize=28:x=1160:y=650[v3];
          [4:v]drawbox=x=0:y=0:w=1920:h=1080:color=0x07172b@1:t=fill,drawbox=x=1040:y=180:w=790:h=720:color=0x0c263d@0.8:t=fill,drawbox=x=1040:y=180:w=790:h=720:color=0x2d657e@0.9:t=4,drawbox=x=90:y=60:w=340:h=66:color=0x0c2437@0.95:t=fill,drawbox=x=90:y=60:w=340:h=66:color=0x2d657e@0.9:t=2,drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:text='ARKON':fontcolor=white:fontsize=32:x=118:y=75,drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf:text='APRENDER  /  CONECTAR  /  TRANSFORMAR':fontcolor=0x76f5db:fontsize=15:x=460:y=83,drawbox=x=90:y=955:w=1740:h=2:color=0x2d657e@0.8:t=fill,drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:text='ARKON  /  EDUCACION PARA LA VIDA':fontcolor=0x91a9c2:fontsize=17:x=100:y=985,drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:text='CONVIVENCIA  -  CIUDADANIA  -  FUTURO':fontcolor=0x91a9c2:fontsize=17:x=1815-tw:y=985,drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:text='05 / 05':fontcolor=0x76f5db:fontsize=26:x=1690:y=225,drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:text='Aprendemos hoy.':fontcolor=white:fontsize=71:x=140:y=300,drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:text='Transformamos':fontcolor=white:fontsize=72:x=140:y=410,drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:text='manana.':fontcolor=0x76f5db:fontsize=86:x=140:y=520,drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf:text='Explora, participa y aporta a tu comunidad.':fontcolor=0xa0b8cf:fontsize=26:x=145:y=680,drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:text='ARKON':fontcolor=0x76f5db:fontsize=58:x=1310:y=430,drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:text='APRENDEMOS HOY':fontcolor=white:fontsize=25:x=1200:y=540,drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:text='TRANSFORMAMOS MANANA':fontcolor=0x76f5db:fontsize=22:x=1200:y=590[v4];
