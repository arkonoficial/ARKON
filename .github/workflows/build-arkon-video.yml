[x1][v2]xfade=transition=fade:duration=0.8:offset=18.4[x2];
[x2][v3]xfade=transition=fade:duration=0.8:offset=27.6[x3];
[x3][v4]xfade=transition=fade:duration=0.8:offset=36.8[x4];
[x4]subtitles=subtitles.srt:force_style='FontName=DejaVu Sans,FontSize=25,PrimaryColour=&H00FFFFFF,OutlineColour=&H00101A2A,BorderStyle=3,Outline=1,Shadow=0,MarginV=48',fade=t=out:st=45.3:d=0.7[v];
[5:a]loudnorm=I=-18:TP=-1.5:LRA=7,afade=t=in:st=0:d=0.25[a]
          FILTERS
          sed -i -e "s/offset=9.2/offset=$O1/g" -e "s/offset=18.4/offset=$O2/g" -e "s/offset=27.6/offset=$O3/g" -e "s/offset=36.8/offset=$O4/g" -e "s/fade=t=out:st=45.3:d=0.7/fade=t=out:st=$FADE_START:d=0.5/" filters.txt

          ffmpeg -hide_banner -loglevel error -y \
            -f lavfi -i "color=c=0x050d1c:s=1920x1080:r=30:d=$SEGMENT" \
            -f lavfi -i "color=c=0x050d1c:s=1920x1080:r=30:d=$SEGMENT" \
            -f lavfi -i "color=c=0x050d1c:s=1920x1080:r=30:d=$SEGMENT" \
            -f lavfi -i "color=c=0x050d1c:s=1920x1080:r=30:d=$SEGMENT" \
            -f lavfi -i "color=c=0x050d1c:s=1920x1080:r=30:d=$SEGMENT" \
            -i voiceover.mp3 \
            -filter_complex_script filters.txt \
            -map "[v]" -map "[a]" -t "$DURATION" \
            -c:v libx264 -preset veryfast -crf 22 -pix_fmt yuv420p \
            -c:a aac -b:a 192k -movflags +faststart arkon-intro.mp4

          test -s arkon-intro.mp4
          ffmpeg -hide_banner -loglevel error -y -ss 1 -i arkon-intro.mp4 -frames:v 1 -q:v 2 arkon-intro-poster.jpg
          ffprobe -v error -show_entries format=duration,size -of default=noprint_wrappers=1 arkon-intro.mp4

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add arkon-intro.mp4 arkon-intro-poster.jpg
          git commit -m "Add narrated ARKON intro MP4"
          git push
