0:y=500,drawbox=x=1110:y=610:w=650:h=110:color=0x142f45@1:t=fill,drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:text='SOLUCIONES':fontcolor=0x9eb4ff:fontsize=28:x=1160:y=650[v3];
