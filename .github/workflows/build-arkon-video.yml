          ffmpeg -hide_banner -loglevel error -y \
            -f lavfi -i "color=c=#050d1c:s=1920x1080:r=30:d=10" \
            -f lavfi -i "color=c=#050d1c:s=1920x1080:r=30:d=10" \
            -f lavfi -i "color=c=#050d1c:s=1920x1080:r=30:d=10" \
            -f lavfi -i "color=c=#050d1c:s=1920x1080:r=30:d=10" \
            -f lavfi -i "color=c=#050d1c:s=1920x1080:r=30:d=10" \
            -i voiceover.mp3 \
            -filter_complex_script filters.txt \
            -map "[v]" -map "[a]" -t 46.068 \
            -c:v libx264 -preset veryfast -crf 22 -pix_fmt yuv420p \
            -c:a aac -b:a 192k -movflags +faststart arkon-intro.mp4

          test -s arkon-intro.mp4
          ffprobe -v error -show_entries format=duration,size -of default=noprint_wrappers=1 arkon-intro.mp4

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add arkon-intro.mp4
          if git diff --cached --quiet; then
            echo "No MP4 changes to commit."
          else
            git commit -m "Add narrated ARKON intro MP4"
            git push
          fi
