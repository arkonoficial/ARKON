[1:v]drawbox=x=1040:y=180:w=790:h=720:color=0x0c263d@0.8:t=fill,drawbox=x=1040:y=180:w=790:h=720:color=0x2d657e@0.9:t=4,drawbox=x=90:y=60:w=340:h=66:color=0x0c2437@0.95:t=fill,drawbox=x=90:y=60:w=340:h=66:color=0x2d657e@0.9:t=2,drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:text='ARKON':fontcolor=white:fontsize=32:x=118:y=75,drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf:text='APRENDER / CONECTAR / TRANSFORMAR':fontcolor=0x76f5db:fontsize=15:x=460:y=83,drawbox=x=90:y=955:w=1740:h=2:color=0x2d657e@0.8:t=fill,drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:text='ARKON / EDUCACION PARA LA VIDA':fontcolor=0x91a9c2:fontsize=17:x=100:y=985,drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:text='CONVIVENCIA - CIUDADANIA - FUTURO':fontcolor=0x91a9c2:fontsize=17:x=1815-tw:y=985,drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:text='02 / 05':fontcolor=0x76f5db:fontsize=26:x=1690:y=225,drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:text='Conocimiento':fontcolor=white:fontsize=72:x=140:y=300,drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:text='que abre':fontcolor=white:fontsize=72:x=140:y=410,drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:text='caminos.':fontcolor=0x76f5db:fontsize=82:x=140:y=520,drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf:text='Conecta ideas y descubre nuevas posibilidades.':fontcolor=0xa0b8cf:fontsize=24:x=145:y=680,drawbox=x=1110:y=310:w=650:h=110:color=0x142f45@1:t=fill,drawbox=x=1110:y=310:w=650:h=110:color=0x2d657e@0.6:t=2,drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:text='IDEAS':fontcolor=0x76f5db:fontsize=29:x=1160:y=350,drawbox=x=1110:y=460:w=650:h=110:color=0x142f45@1:t=fill,drawbox=x=1110:y=460:w=650:h=110:color=0x2d657e@0.6:t=2,drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:text='CURIOSIDAD':fontcolor