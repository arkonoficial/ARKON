name: Render ARKON intro video

on:
  push:
    paths:
      - ".github/workflows/build-arkon-video.yml"

permissions:
  contents: write

concurrency:
  group: arkon-video-render
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout ARKON
        uses: actions/checkout@v4

      - name: Install rendering and neural voice tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core fontconfig python3-venv
          python3 -m venv .venv
          . .venv/bin/activate
          python -m pip install --upgrade pip edge-tts
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"

      - name: Render narrated ARKON MP4
        run: |
          set -euo pipefail
          SCRIPT="Bienvenido a ARKON. Un espacio para aprender, conectar ideas y construir un mejor futuro. Aquí fortalecemos la convivencia, la ciudadanía y las habilidades que nos preparan para trabajar en equipo, resolver problemas y aportar a nuestra comunidad. Explora, participa y convierte el conocimiento en acción. ARKON: aprendemos hoy, transformamos mañana."
          python -m edge_tts --voice es-CO-GonzaloNeural --rate=-6% --text "$SCRIPT" --write-media voiceover.mp3
          test -s voiceover.mp3
          DURATION="$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 voiceover.mp3)"
          read -r SEGMENT O1 O2 O3 O4 FADE_START < <(python - "$DURATION" <<'PY'
          import sys
          d = float(sys.argv[1])
          segment = (d + 3.2) / 5
          fade_start = max(0, d - 0.6)
          print(f"{segment:.3f} {segment-0.8:.3f} {2*segment-1.6:.3f} {3*segment-2.4:.3f} {4*segment-3.2:.3f} {fade_start:.3f}")
          PY
          )
          python - "$DURATION" <<'PY'
          import sys
          duration = float(sys.argv[1])
          captions = [
              (0.00, 0.07, "Bienvenido a ARKON."),
              (0.07, 0.27, "Un espacio para aprender, conectar ideas y construir un mejor futuro."),
              (0.27, 0.56, "Aquí fortalecemos la convivencia, la ciudadanía y las habilidades\nque nos preparan para trabajar en equipo."),
              (0.56, 0.71, "Resolver problemas y aportar a nuestra comunidad."),
              (0.71, 0.89, "Explora, participa y convierte el conocimiento en acción."),
              (0.89, 1.00, "ARKON: aprendemos hoy, transformamos mañana."),
          ]
          def stamp(seconds):
              total = max(0, round(seconds * 1000))
              hours, total = divmod(total, 3_600_000)
              minutes, total = divmod(total, 60_000)
              seconds, millis = divmod(total, 1000)
              return f"{hours:02}:{minutes:02}:{seconds:02},{millis:03}"
          with open("subtitles.srt", "w", encoding="utf-8") as file:
              for number, (start, end, text) in enumerate(captions, 1):
                  file.write(f"{number}\n{stamp(start*duration)} --> {stamp(end*duration)}\n{text}\n\n")
          PY

          cat > filters.txt <<'FILTERS'
[0:v]drawbox=x=1040:y=180:w=790:h=720:color=0x0c263d@0.8:t=fill,drawbox=x=1040:y=180:w=790:h=720:color=0x2d657e@0.9:t=4,drawbox=x=90:y=60:w=340:h=66:color=0x0c2437@0.95:t=fill,drawbox=x=90:y=60:w=340:h=66:color=0x2d657e@0.9:t=2,drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:text='ARKON':fontcolor=white:fontsize=32:x=118:y=75,drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf:text='APRENDER / CONECTAR / TRANSFORMAR':fontcolor=0x76f5db:fontsize=15:x=460:y=83,drawbox=x=90:y=955:w=1740:h=2:color=0x2d657e@0.8:t=fill,drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:text='ARKON / EDUCACION PARA LA VIDA':fontcolor=0x91a9c2:fontsize=17:x=100:y=985,drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:text='CONVIVENCIA - CIUDADANIA - FUTURO':fontcolor=0x91a9c2:fontsize=17:x=1815-tw:y=985,drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:text='01 / 05':fontcolor=0x76f5db:fontsize=26:x=1690:y=225,drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:text='Aprende.':fontcolor=white:fontsize=80:x=140:y=300,drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:text='Conecta.':fontcolor=white:fontsize=80:x=140:y=410,drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:text='Transforma.':fontcolor=0x76f5db:fontsize=82:x=140:y=520,drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf:text='Ideas que se convierten en acciones.':fontcolor=0xa0b8cf:fontsize=24:x=145:y=680,drawbox=x=1110:y=310:w=650:h=110:color=0x142f45@1:t=fill,drawbox=x=1110:y=310:w=650:h=110:color=0x2d657e@0.6:t=2,drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:text='DESCUBRE':fontcolor=0x76f5db:fontsize=29:x=1160:y=350,drawbox=x=1110:y=460:w=650:h=110:color=0x142f45@1:t=fill,drawbox=x=1110:y=460:w=650:h=110:color=0x2d657e@0.6:t=2,drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:text='CONECTA':fontcolor=0x4ccbed:f