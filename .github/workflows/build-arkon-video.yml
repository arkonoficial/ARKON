fontcolor=0x4ccbed:fontsize=29:x=1160:y=500,drawbox=x=1110:y=610:w=650:h=110:color=0x142f45@1:t=fill,drawbox=x=1110:y=610:w=650:h=110:color=0x2d657e@0.6:t=2,drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:text='FUTURO':fontcolor=0x9eb4ff:fontsize=29:x=1160:y=650[v4];
