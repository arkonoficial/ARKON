<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1500" viewBox="0 0 1000 1500" role="img" aria-labelledby="t d">
<title id="t">Dilema social: Sistema General de Riesgos Laborales de Colombia</title>
<desc id="d">Infografía escolar ilustrada sobre prevención de riesgos laborales, el dilema entre producción y seguridad, responsabilidades y normas colombianas.</desc>
<defs>
 <linearGradient id="navy" x2="1" y2="1"><stop stop-color="#082846"/><stop offset="1" stop-color="#15517e"/></linearGradient>
 <linearGradient id="blue" x2="0" y2="1"><stop stop-color="#e7f4ff"/><stop offset="1" stop-color="#c5e2fa"/></linearGradient>
 <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#092b49" flood-opacity=".15"/></filter>
</defs>
<rect width="1000" height="1500" fill="#f7fbff"/>
<path d="M0 0H1000V18H0Z" fill="#f4c531"/>
<rect x="42" y="35" width="916" height="108" rx="25" fill="url(#navy)"/>
<text x="500" y="111" text-anchor="middle" font-family="Arial,sans-serif" font-size="65" font-weight="900" fill="#fff" letter-spacing="2">DILEMA SOCIAL</text>
<rect x="65" y="158" width="870" height="62" rx="18" fill="#cce7ff" stroke="#397eb2" stroke-width="3"/>
<text x="500" y="198" text-anchor="middle" font-family="Arial,sans-serif" font-size="29" font-weight="800" fill="#12395e">Sistema General de Riesgos Laborales de Colombia</text>
<!-- intro -->
<g filter="url(#shadow)">
<rect x="42" y="244" width="438" height="280" rx="20" fill="#fff" stroke="#1b527d" stroke-width="3"/>
<rect x="42" y="244" width="438" height="62" rx="18" fill="url(#navy)"/>
<path d="M42 288H480V306H42Z" fill="#123d64"/>
<rect x="520" y="244" width="438" height="280" rx="20" fill="#fff" stroke="#1b527d" stroke-width="3"/>
<rect x="520" y="244" width="438" height="62" rx="18" fill="url(#navy)"/>
<path d="M520 288H958V306H520Z" fill="#123d64"/>
</g>
<g font-family="Arial,sans-serif" fill="#fff" font-weight="900" font-size="32" text-anchor="middle"><text x="261" y="286">¿QUÉ ES?</text><text x="739" y="286">EL DILEMA</text></g>
<g font-family="Arial,sans-serif" fill="#172f46" font-size="24">
<text x="70" y="350"><tspan x="70" dy="0">Es el sistema que busca</tspan><tspan x="70" dy="33">prevenir, proteger y atender</tspan><tspan x="70" dy="33">a los trabajadores frente a</tspan><tspan x="70" dy="33">accidentes y enfermedades</tspan><tspan x="70" dy="33">relacionados con el trabajo.</tspan></text>
<text x="548" y="350"><tspan x="548" dy="0">Una empresa debe entregar un</tspan><tspan x="548" dy="33">pedido rápido y reducir costos.</tspan><tspan x="548" dy="33">¿Sigue trabajando aunque exista</tspan><tspan x="548" dy="33">un peligro o detiene la actividad</tspan><tspan x="548" dy="33">para proteger a sus trabajadores?</tspan></text>
</g>
<!-- two paths -->
<rect x="42" y="548" width="916" height="60" rx="17" fill="url(#navy)"/>
<text x="500" y="589" font-family="Arial" font-size="32" font-weight="900" fill="#fff" text-anchor="middle">DOS CAMINOS</text>
<g filter="url(#shadow)">
<rect x="42" y="620" width="438" height="222" rx="18" fill="#fff" stroke="#d9a02c" stroke-width="4"/>
<rect x="520" y="620" width="438" height="222" rx="18" fill="#fff" stroke="#4baf76" stroke-width="4"/>
</g>
<rect x="42" y="620" width="438" height="55" rx="14" fill="#ffedc4"/><rect x="520" y="620" width="438" height="55" rx="14" fill="#d9f3e2"/>
<g font-family="Arial" font-size="24" font-weight="900" fill="#183b5b" text-anchor="middle"><text x="261" y="656">PRIORIDAD: PRODUCCIÓN</text><text x="739" y="656">PRIORIDAD: PREVENCIÓN</text></g>
<g font-family="Arial" font-size="22" fill="#20364b">
<text x="70" y="716"><tspan x="70">Aumenta la exposición al</tspan><tspan x="70" dy="31">riesgo y puede causar</tspan><tspan x="70" dy="31">accidentes o enfermedades</tspan><tspan x="70" dy="31">laborales.</tspan></text>
<text x="548" y="716"><tspan x="548">Identificar peligros, aplicar</tspan><tspan x="548" dy="31">medidas de seguridad y</tspan><tspan x="548" dy="31">cuidar la vida y la salud.</tspan></text>
</g>
<!-- roles -->
<rect x="42" y="866" width="916" height="60" rx="17" fill="url(#navy)"/>
<text x="500" y="907" font-family="Arial" font-size="31" font-weight="900" fill="#fff" text-anchor="middle">¿QUIÉN TIENE RESPONSABILIDADES?</text>
<g filter="url(#shadow)">
<rect x="42" y="940" width="288" height="220" rx="17" fill="#fff" stroke="#b9d5ec" stroke-width="3"/>
<rect x="356" y="940" width="288" height="220" rx="17" fill="#fff" stroke="#b9d5ec" stroke-width="3"/>
<rect x="670" y="940" width="288" height="220" rx="17" fill="#fff" stroke="#b9d5ec" stroke-width="3"/>
</g>
<g font-family="Arial" font-size="24" font-weight="900" fill="#12395e" text-anchor="middle"><text x="186" y="979">EMPRESA</text><text x="500" y="979">ARL</text><text x="814" y="979">TRABAJADOR</text></g>
<g font-family="Arial" font-size="19" fill="#20364b" text-anchor="middle">
<text x="186" y="1030"><tspan x="186">Afiliar a sus trabajadores,</tspan><tspan x="186" dy="27">implementar el SG-SST</tspan><tspan x="186" dy="27">y aplicar medidas de</tspan><tspan x="186" dy="27">prevención.</tspan></text>
<text x="500" y="1030"><tspan x="500">Asesorar y brindar</tspan><tspan x="500" dy="27">asistencia técnica,</tspan><tspan x="500" dy="27">apoyar la prevención y</tspan><tspan x="500" dy="27">atención del sistema.</tspan></text>
<text x="814" y="1030"><tspan x="814">Cumplir las normas de</tspan><tspan x="814" dy="27">seguridad, cuidar su salud</tspan><tspan x="814" dy="27">e informar los peligros</tspan><tspan x="814" dy="27">y accidentes.</tspan></text>
</g>
<!-- resolution -->
<g filter="url(#shadow)">
<rect x="42" y="1180" width="438" height="190" rx="18" fill="#fff" stroke="#1b527d" stroke-width="3"/>
<rect x="520" y="1180" width="438" height="190" rx="18" fill="url(#blue)" stroke="#1b527d" stroke-width="3"/>
</g>
<rect x="42" y="1180" width="438" height="54" rx="15" fill="url(#navy)"/><rect x="520" y="1180" width="438" height="54" rx="15" fill="url(#navy)"/>
<g font-family="Arial" font-size="27" font-weight="900" fill="#fff" text-anchor="middle"><text x="261" y="1217">¿CÓMO SE RESUELVE?</text><text x="739" y="1217">IDEA CLAVE</text></g>
<g font-family="Arial" font-size="20" fill="#20364b">
<text x="68" y="1270"><tspan x="68">No sacrificar la seguridad por ahorrar</tspan><tspan x="68" dy="28">tiempo o dinero. Corregir peligros,</tspan><tspan x="68" dy="28">informar riesgos y aplicar medidas</tspan><tspan x="68" dy="28">de protección y prevención.</tspan></text>
<text x="548" y="1280" font-size="23" font-weight="700"><tspan x="548">La productividad importa,</tspan><tspan x="548" dy="32">pero nunca debe estar por</tspan><tspan x="548" dy="32">encima de la vida y la salud</tspan><tspan x="548" dy="32">de las personas.</tspan></text>
</g>
<path d="M65 1400H935" stroke="#1c527c" stroke-width="3"/>
<text x="500" y="1435" text-anchor="middle" font-family="Arial" font-size="21" font-weight="700" fill="#12395e">BASE NORMATIVA: LEY 1562 DE 2012 · DECRETO 1072 DE 2015</text>
<path d="M0 1462H1000V1500H0Z" fill="#e7b923"/><path d="M0 1474H1000V1500H0Z" fill="#12395e"/><path d="M0 1485H1000V1500H0Z" fill="#d9272e"/>
</svg>